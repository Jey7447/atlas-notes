<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Notes</title>
<style>
:root{--bg:#0d0f12;--panel:#14171b;--panel2:#191d22;--line:#292e35;--text:#eef1f4;--muted:#8f98a4;--accent:#8ab4ff;--accent2:#b9a7ff;--danger:#ff7777;--shadow:0 20px 60px #0007}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input,textarea,select{font:inherit}button{border:0;color:inherit;background:none;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{border-right:1px solid var(--line);background:#111418;padding:18px 14px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:2px 8px}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#101217;font-weight:900}.nav{display:grid;gap:4px}.nav button,.folder{padding:10px 11px;border-radius:9px;text-align:left;color:#b8c0ca}.nav button:hover,.nav .active,.folder:hover{background:#1b2026;color:#fff}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#69727d;padding:5px 10px}.folders{display:grid;gap:3px;overflow:auto}.folder{display:flex;justify-content:space-between}.bottom{margin-top:auto;display:grid;gap:6px}.content{min-width:0;display:grid;grid-template-columns:340px 1fr;height:100vh}.list{border-right:1px solid var(--line);background:#101317;display:flex;flex-direction:column;min-width:0}.listhead{padding:18px;border-bottom:1px solid var(--line)}.search{display:flex;align-items:center;gap:8px;background:#1a1e23;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.search input{border:0;outline:0;background:none;color:#fff;width:100%}.toolbar{display:flex;gap:6px;margin-top:10px}.pill{padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:#aeb6c0}.pill:hover{background:#1c2127}.notes{overflow:auto;padding:8px}.note{padding:13px 12px;border-radius:10px;margin:2px 0}.note:hover,.note.active{background:#1b2026}.note-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-meta{font-size:11px;color:#707985;margin-top:4px}.note-tags{display:flex;gap:4px;margin-top:7px}.tag{font-size:10px;padding:2px 6px;border-radius:999px;background:#252b32;color:#aeb8c4}.editor{min-width:0;display:flex;flex-direction:column;background:#0d0f12}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.crumb{color:#77818c;font-size:12px}.actions{display:flex;gap:4px}.iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}.iconbtn:hover{background:#1b2026}.editorbody{max-width:920px;width:100%;margin:0 auto;padding:48px 52px;overflow:auto}.type{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.13em}.title{font-size:38px;line-height:1.12;font-weight:760;margin:10px 0 18px;outline:0}.meta-row{display:flex;gap:8px;align-items:center;color:#737d89;font-size:12px;margin-bottom:28px}.prose{min-height:380px;outline:0;font-size:16px;line-height:1.8;color:#d9dee4}.prose:empty:before{content:'Start writing…';color:#5d6671}.prose a{color:var(--accent)}.prose blockquote{border-left:3px solid #566273;margin-left:0;padding-left:16px;color:#aeb6c0}.status{color:#68727d;font-size:11px}.home{padding:42px 48px;overflow:auto}.home h1{font-size:34px;margin:0 0 6px}.sub{color:#7e8893;margin-bottom:28px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#14181d;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:130px}.card h3{margin:0 0 8px}.card p{color:#818b96;margin:0}.canvas-wrap{position:relative;height:calc(100vh - 62px);overflow:hidden;background-color:#0c0f12;background-image:radial-gradient(#252a31 1px,transparent 1px);background-size:24px 24px}.canvas-tools{position:absolute;top:16px;left:16px;z-index:3;display:flex;gap:4px;background:#15191e;border:1px solid var(--line);padding:5px;border-radius:10px}.draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.canvas-note{position:absolute;width:220px;min-height:130px;background:#171b20;border:1px solid #343a42;border-radius:12px;padding:14px;box-shadow:var(--shadow)}.canvas-note strong{display:block;margin-bottom:8px}.canvas-note textarea{width:100%;height:80px;background:none;border:0;outline:0;color:#dfe4e9;resize:none}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20}.modalbox{width:min(700px,92vw);max-height:85vh;overflow:auto;background:#15191e;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.form{display:grid;gap:12px}.field{background:#0f1215;border:1px solid var(--line);border-radius:9px;padding:10px;color:#fff;outline:0}.drop{border:1px dashed #3c444e;border-radius:12px;padding:28px;text-align:center;color:#8a949f}.results{display:grid;gap:6px}.result{padding:10px;border-radius:8px;background:#1a1e23}.toast{position:fixed;right:20px;bottom:20px;background:#f2f4f7;color:#101318;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);z-index:50}.hidden{display:none!important}.split{display:grid;grid-template-columns:1fr 260px;gap:20px}.sidecard{border-left:1px solid var(--line);padding-left:18px;color:#8d97a2}.sidecard h4{color:#dce1e6;margin-top:0}.version{padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.audio{width:100%}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.sidebar{padding:14px 8px}.brand span,.nav button span,.section-label,.folders,.bottom span{display:none}.brand{justify-content:center}.content{grid-template-columns:260px 1fr}.cards{grid-template-columns:1fr}.editorbody{padding:28px 24px}.title{font-size:30px}}
</style></head><body><div id="app"></div>
<script>
(()=>{const KEY='atlas-notes-v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{notes:[{id:1,title:'Welcome to Atlas',type:'page',folder:'Personal',tags:['start'],pinned:true,updated:Date.now(),body:'<h2>A calm place for serious notes.</h2><p>Atlas is built for lectures, research, PDFs, quick ideas and everything between. Use the sidebar to switch spaces, ⌘/Ctrl+K to search, and Quick Capture for ideas that should not interrupt your flow.</p><blockquote>Notes should help you think, not make you manage the tool.</blockquote>'},{id:2,title:'Research — materials',type:'research',folder:'Research',tags:['papers','sources'],updated:Date.now()-3600000,body:'<p>Collect links, quotes, screenshots and source notes here.</p>'},{id:3,title:'Thermodynamics — Lecture 4',type:'page',folder:'University',tags:['mech','uni'],updated:Date.now()-7200000,body:'<p>Entropy, control volumes and the second law.</p>'}],scratch:[],canvas:[],versions:{}};let current=state.notes[0]?.id||null,view='home',query='',modal=null,drawMode=false,recording=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const note=()=>state.notes.find(n=>n.id===current);const icon=(x)=>`<span>${x}</span>`;
function layout(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">A</div><span>Atlas Notes</span></div><div class="nav"><button class="${view==='home'?'active':''}" onclick="setView('home')">⌂ <span>Home</span></button><button onclick="quick()">＋ <span>Quick Capture</span></button><button class="${view==='canvas'?'active':''}" onclick="setView('canvas')">⌁ <span>Infinite Canvas</span></button><button onclick="setView('scratch')">◌ <span>Scratch Notes</span></button><button onclick="setView('research')">↗ <span>Research</span></button><button onclick="setView('pdf')">▧ <span>PDF Studio</span></button></div><div class="section-label">Notebooks</div><div class="folders">${['University','Research','Personal','Projects'].map(f=>`<button class="folder" onclick="folder('${f}')">${f}<small>${state.notes.filter(n=>n.folder===f).length}</small></button>`).join('')}</div><div class="bottom"><button class="pill" onclick="exportAll()">⇩ <span>Export</span></button><button class="pill" onclick="newNote()">＋ <span>New note</span></button></div></aside><main class="content"><section class="list"><div class="listhead"><div class="search">⌕ <input id="search" placeholder="Search notes…" value="${esc(query)}" oninput="search(this.value)"><kbd>Ctrl K</kbd></div><div class="toolbar"><button class="pill" onclick="filterPinned()">☆ Pinned</button><button class="pill" onclick="newNote()">＋</button></div></div><div class="notes">${renderList()}</div></section><section class="editor">${renderMain()}</section></main></div>`;if(view==='page')bindEditor();}
function renderList(){let arr=state.notes.filter(n=>!query||JSON.stringify(n).toLowerCase().includes(query.toLowerCase()));if(view==='research')arr=arr.filter(n=>n.type==='research');if(view==='scratch')arr=state.scratch.filter(n=>n.expires>Date.now());return arr.length?arr.map(n=>`<div class="note ${n.id===current?'active':''}" onclick="openNote(${n.id})"><div class="note-title">${n.pinned?'★ ':''}${esc(n.title||'Untitled')}</div><div class="note-meta">${n.folder||'Scratch'} · ${new Date(n.updated||n.created||Date.now()).toLocaleDateString()}</div><div class="note-tags">${(n.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`).join(''):'<div style="padding:25px;color:#68727d">Nothing here yet.</div>'}
function renderMain(){if(view==='home')return `<div class="home"><div class="type">Workspace</div><h1>Good evening.</h1><div class="sub">A focused home for your notes, research and ideas.</div><div class="cards"><div class="card" onclick="newNote()"><h3>＋ New page</h3><p>Start a clean note with keyboard-first editing.</p></div><div class="card" onclick="quick()"><h3>⚡ Quick Capture</h3><p>Get an idea out of your head before it disappears.</p></div><div class="card" onclick="setView('canvas')"><h3>⌁ Canvas</h3><p>Spread diagrams, handwritten thoughts and references across infinite space.</p></div></div><h3 style="margin-top:38px">Recent</h3><div class="cards">${state.notes.slice().sort((a,b)=>b.updated-a.updated).slice(0,6).map(n=>`<div class="card" onclick="openNote(${n.id})"><h3>${esc(n.title)}</h3><p>${esc((n.body||'').replace(/<[^>]+>/g,' ').slice(0,110))}</p></div>`).join('')}</div></div>`;
if(view==='canvas')return `<div class="topbar"><div><div class="crumb">Workspace / Canvas</div><strong>Infinite Canvas</strong></div><div class="actions"><button class="iconbtn" onclick="addCanvasNote()">＋</button><button class="iconbtn" onclick="clearInk()">⌫</button></div></div><div class="canvas-wrap"><div class="canvas-tools"><button class="iconbtn" onclick="toggleDraw()">✎</button><button class="iconbtn" onclick="addCanvasNote()">▣</button><button class="iconbtn" onclick="saveCanvas()">✓</button></div><canvas class="draw" id="draw"></canvas>${state.canvas.map((c,i)=>`<div class="canvas-note" style="left:${c.x}px;top:${c.y}px" draggable="true"><strong>${esc(c.title)}</strong><textarea oninput="state.canvas[${i}].body=this.value;save()">${esc(c.body||'')}</textarea></div>`).join('')}</div>`;
if(view==='pdf')return `<div class="topbar"><div><div class="crumb">Workspace / PDF Studio</div><strong>PDF Studio</strong></div></div><div class="home"><div class="type">Import & annotate</div><h1>PDF Studio</h1><p class="sub">Import a PDF, move through its pages, and draw directly on a transparent annotation layer.</p><div class="drop"><input id="pdfFile" type="file" accept="application/pdf" onchange="openPdf(this.files[0])"><div style="margin-top:10px">Choose a PDF to open it in the browser viewer.</div></div><div id="pdfArea" style="margin-top:20px"></div></div>`;
if(view==='scratch')return `<div class="home"><div class="type">Temporary</div><h1>Scratch notes</h1><p class="sub">Fast notes that disappear when their expiry arrives.</p><button class="pill" onclick="newScratch()">＋ New scratch</button><div class="cards" style="margin-top:18px">${state.scratch.filter(n=>n.expires>Date.now()).map(n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>Expires ${new Date(n.expires).toLocaleString()}</small></div>`).join('')}</div></div>`;
if(view==='research')return current?renderEditor():`<div class="home"><h1>Research</h1><p class="sub">Sources, quotes, links and personal notes.</p></div>`;return renderEditor();}
function renderEditor(){let n=note();if(!n)return `<div class="home"><h1>Select a note</h1></div>`;return `<div class="topbar"><div><div class="crumb">${esc(n.folder||'Personal')} / ${esc(n.type||'page')}</div><span class="status" id="saveStatus">Saved locally</span></div><div class="actions"><button class="iconbtn" onclick="togglePin()">${n.pinned?'★':'☆'}</button><button class="iconbtn" onclick="showVersions()">◷</button><button class="iconbtn" onclick="recordAudio()">●</button><button class="iconbtn" onclick="exportNote()">⇩</button><button class="iconbtn" onclick="deleteNote()">⌫</button></div></div><div class="editorbody"><div class="type">${n.type==='research'?'Research note':'Page'}</div><div class="title" contenteditable="true" id="title">${esc(n.title)}</div><div class="meta-row"><span>${esc(n.folder||'Personal')}</span>${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span>·</span><span>${new Date(n.updated).toLocaleString()}</span></div><div class="split"><div class="prose" id="prose" contenteditable="true">${n.body||''}</div><aside class="sidecard"><h4>Backlinks</h4>${backlinks(n).map(x=>`<div class="version" onclick="openNote(${x.id})">↗ ${esc(x.title)}</div>`).join('')||'<span>No backlinks yet.</span>'}<h4 style="margin-top:25px">Research</h4><button class="pill" onclick="attach()">＋ Attachment</button><div id="attachments">${(n.attachments||[]).map(a=>`<div class="version">${esc(a.name)}</div>`).join('')}</div></aside></div></div>`}
function bindEditor(){const n=note(),t=document.getElementById('title'),p=document.getElementById('prose');if(!n||!t||!p)return;t.oninput=()=>{n.title=t.innerText.trim()||'Untitled';touch();};p.oninput=()=>{n.body=p.innerHTML;touch();};p.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();flash('Saved');}}}
function touch(){let n=note();n.updated=Date.now();save();document.getElementById('saveStatus')?.replaceChildren(document.createTextNode('Saved locally'));}
function openNote(id){current=id;view='page';layout()}function setView(v){view=v;if(v==='home'||v==='canvas'||v==='pdf'||v==='scratch'){}else if(v==='research'){current=state.notes.find(n=>n.type==='research')?.id||null}layout()}function search(v){query=v;layout();document.getElementById('search')?.focus();}
function newNote(){const n={id:Date.now(),title:'Untitled note',type:'page',folder:'Personal',tags:[],updated:Date.now(),body:''};state.notes.unshift(n);current=n.id;view='page';save();layout();document.getElementById('title')?.focus()}function quick(){const text=prompt('Quick Capture — type an idea, question or reminder:');if(!text)return;const n={id:Date.now(),title:'Quick Capture',type:'page',folder:'Personal',tags:['quick'],updated:Date.now(),body:`<p>${esc(text)}</p>`};state.notes.unshift(n);current=n.id;view='page';save();layout()}function newScratch(){const text=prompt('Scratch note:');if(!text)return;const mins=Number(prompt('Expire after how many minutes?','60'))||60;state.scratch.unshift({id:Date.now(),title:'Scratch',body:text,created:Date.now(),expires:Date.now()+mins*60000});save();layout()}function folder(f){view='page';const n=state.notes.find(n=>n.folder===f);current=n?.id||null;query='';layout()}function filterPinned(){query='';const n=state.notes.find(n=>n.pinned);current=n?.id||null;view='page';layout()}function togglePin(){let n=note();n.pinned=!n.pinned;touch();layout()}function deleteNote(){if(!confirm('Delete this note?'))return;state.notes=state.notes.filter(n=>n.id!==current);current=state.notes[0]?.id||null;view='home';save();layout()}function backlinks(n){return state.notes.filter(x=>x.id!==n.id&&((x.body||'').toLowerCase().includes(n.title.toLowerCase())||(x.body||'').includes(`[[${n.title}]]`)))}function attach(){const input=document.createElement('input');input.type='file';input.accept='image/*,.pdf,.txt';input.onchange=()=>{const f=input.files[0];if(!f)return;let n=note();n.attachments=n.attachments||[];n.attachments.push({name:f.name,type:f.type,size:f.size});touch();layout()};input.click()}function exportNote(){const n=note();const blob=new Blob([`${n.title}\n\n${(n.body||'').replace(/<[^>]+>/g,'')}`],{type:'text/plain'});download(blob,n.title+'.txt')}function exportAll(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'atlas-notes-backup.json')}function download(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function flash(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1600)}function showVersions(){let n=note();state.versions[n.id]=state.versions[n.id]||[];state.versions[n.id].push({at:Date.now(),title:n.title,body:n.body});save();modal=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>Version history</h2><button class="iconbtn" onclick="closeModal()">×</button></div>${state.versions[n.id].slice(-12).reverse().map((v,i)=>`<div class="version"><strong>${new Date(v.at).toLocaleString()}</strong><p>${esc((v.body||'').replace(/<[^>]+>/g,' ').slice(0,140))}</p><button class="pill" onclick="restoreVersion(${state.versions[n.id].length-1-i})">Restore</button></div>`).join('')||'<p>No versions yet.</p>'}</div></div>`;document.body.insertAdjacentHTML('beforeend',modal)}function restoreVersion(i){const n=note(),v=state.versions[n.id][i];if(!v)return;n.title=v.title;n.body=v.body;n.updated=Date.now();save();closeModal();layout()}function closeModal(){document.querySelector('.modal')?.remove()}function recordAudio(){if(recording){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia)return flash('Audio recording is not available in this browser.');navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{const rec=new MediaRecorder(stream),chunks=[];recording=rec;rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);const n=note();n.audio=n.audio||[];n.audio.push({name:'Recording '+new Date().toLocaleTimeString(),url});recording=null;flash('Recording saved to this session');};rec.start();flash('Recording… click ● again to stop')}).catch(()=>flash('Microphone permission was denied.'))}
function addCanvasNote(){state.canvas.push({x:80+state.canvas.length*30,y:100+state.canvas.length*25,title:'Canvas note',body:''});save();layout()}function toggleDraw(){drawMode=!drawMode;const c=document.getElementById('draw');if(!c)return;resizeCanvas(c);c.style.pointerEvents=drawMode?'auto':'none';if(drawMode)setupDraw(c)}function resizeCanvas(c){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;c.getContext('2d').scale(devicePixelRatio,devicePixelRatio)}function setupDraw(c){let on=false,last=null;c.onpointerdown=e=>{on=true;last=[e.offsetX,e.offsetY]};c.onpointermove=e=>{if(!on)return;const g=c.getContext('2d');g.strokeStyle='#aebfff';g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(e.offsetX,e.offsetY);g.stroke();last=[e.offsetX,e.offsetY]};c.onpointerup=()=>{on=false;saveCanvas()};c.onpointercancel=()=>on=false}function clearInk(){const c=document.getElementById('draw');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}function saveCanvas(){flash('Canvas saved for this session')}function openPdf(file){if(!file)return;const url=URL.createObjectURL(file);document.getElementById('pdfArea').innerHTML=`<div style="position:relative;height:70vh;background:#222"><iframe src="${url}" style="width:100%;height:100%;border:0"></iframe><canvas id="pdfInk" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:auto"></canvas></div><p class="status">Use the transparent layer to write/draw over the visible PDF page. Browser PDF viewers may display multiple pages internally; for page-by-page editing, open the PDF in a dedicated viewer.</p>`;const c=document.getElementById('pdfInk');let on=false,last; c.onpointerdown=e=>{on=true;last=[e.offsetX,e.offsetY]};c.onpointermove=e=>{if(!on)return;let g=c.getContext('2d');g.strokeStyle='#ffce65';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(e.offsetX,e.offsetY);g.stroke();last=[e.offsetX,e.offsetY]};c.onpointerup=()=>on=false}
window.setView=setView;window.openNote=openNote;window.newNote=newNote;window.quick=quick;window.newScratch=newScratch;window.folder=folder;window.filterPinned=filterPinned;window.togglePin=togglePin;window.deleteNote=deleteNote;window.attach=attach;window.exportNote=exportNote;window.exportAll=exportAll;window.showVersions=showVersions;window.restoreVersion=restoreVersion;window.closeModal=closeModal;window.recordAudio=recordAudio;window.addCanvasNote=addCanvasNote;window.toggleDraw=toggleDraw;window.clearInk=clearInk;window.saveCanvas=saveCanvas;window.openPdf=openPdf;window.search=search;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search')?.focus()}});layout();
})();
</script></body></html>

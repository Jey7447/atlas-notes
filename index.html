<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Notes</title>
<style>
:root{--bg:#0b0d10;--panel:#111419;--panel2:#171b21;--panel3:#1c2128;--line:#282e36;--text:#edf1f5;--muted:#8b95a1;--accent:#9abaff;--accent2:#c0b1ff;--good:#8ed6aa;--warn:#ffd27d;--danger:#ff8585;--shadow:0 22px 70px #0009}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;color:inherit;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-columns:236px 320px minmax(0,1fr)}
.sidebar{background:#0f1216;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-size:17px;font-weight:780}.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0d12;font-weight:900}
.nav,.folders{display:grid;gap:3px}.nav button,.folder{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border-radius:9px;color:#aeb7c2}.nav button:hover,.nav button.active,.folder:hover{background:#1a1f25;color:#fff}.section-label{padding:6px 10px 2px;color:#68727e;text-transform:uppercase;letter-spacing:.13em;font-size:10px}.folder{justify-content:space-between}.folder span{overflow:hidden;text-overflow:ellipsis}.count{font-size:10px;color:#67717d}.bottom{margin-top:auto;display:grid;gap:6px}
.btn{border:1px solid var(--line);background:#15191e;border-radius:9px;padding:8px 10px;color:#bfc7d0}.btn:hover{background:#1d232a;color:#fff}.primary{background:#dfe9ff;color:#10141b;border-color:#dfe9ff}.primary:hover{background:#fff;color:#10141b}.danger{color:#ff9a9a}
.library{min-width:0;background:#0e1115;border-right:1px solid var(--line);display:flex;flex-direction:column}.library-head{padding:16px 14px 12px;border-bottom:1px solid var(--line)}.search{display:flex;align-items:center;gap:8px;background:#171b20;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.search input{width:100%;border:0;outline:0;background:none;color:#fff}.search kbd{font-size:10px;color:#67717d;border:1px solid #303640;border-radius:5px;padding:1px 5px}.library-tools{display:flex;gap:6px;margin-top:9px}.filter{font-size:11px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;color:#9ea8b3}.filter.active{background:#20262e;color:#fff}.note-list{overflow:auto;padding:7px}.note-row{padding:11px;border-radius:9px;margin:2px 0;cursor:pointer}.note-row:hover,.note-row.active{background:#191e24}.note-row-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-row-preview{color:#717b87;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-row-meta{display:flex;gap:6px;align-items:center;color:#5f6975;font-size:10px;margin-top:6px}.tag{background:#242a32;color:#aeb8c4;padding:2px 6px;border-radius:999px;font-size:10px}.pin{color:#ffd47c}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:0 0 auto}.crumb{font-size:11px;color:#707a86}.top-title{font-weight:650}.actions{display:flex;gap:3px;align-items:center}.icon{width:33px;height:33px;border-radius:8px;display:grid;place-items:center}.icon:hover{background:#1b2026}.status{font-size:10px;color:#68737f}.scroll{overflow:auto;min-height:0}.editor-shell{max-width:1050px;width:100%;margin:0 auto;padding:38px 54px 80px}.editor-title{font-size:40px;line-height:1.12;font-weight:780;outline:0;min-height:48px}.editor-title:empty:before{content:"Untitled";color:#555f6b}.editor-meta{display:flex;gap:7px;align-items:center;color:#6f7985;font-size:11px;margin:10px 0 20px}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:30px}.editor{min-height:500px;outline:0;font-size:16px;line-height:1.85;color:#dce2e8}.editor:empty:before{content:"Start writing…";color:#535d68}.editor h1,.editor h2,.editor h3{line-height:1.25}.editor blockquote{border-left:3px solid #536071;margin:18px 0;padding:2px 0 2px 16px;color:#adb7c2}.editor pre{background:#101419;border:1px solid var(--line);padding:14px;border-radius:9px;overflow:auto}.editor img{max-width:100%;border-radius:9px}.editor ul,.editor ol{padding-left:25px}.side{border-left:1px solid var(--line);padding-left:18px;color:#87919c}.side h4{color:#dce2e8;margin:0 0 8px}.side-section{margin-bottom:22px}.side-item{padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;font-size:11px}.side-item:hover{background:#1a1f25;color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#11151a;margin-bottom:14px;position:sticky;top:8px;z-index:3}.tool{min-width:30px;height:29px;padding:0 7px;border-radius:7px;color:#aeb7c1}.tool:hover,.tool.active{background:#20262e;color:#fff}.tool-sep{width:1px;background:var(--line);margin:3px 3px}
.home{padding:40px 44px;overflow:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:10px}.home h1{font-size:34px;margin:5px 0}.muted{color:#7d8793}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:25px}.home-card{border:1px solid var(--line);background:#12161b;border-radius:14px;padding:17px;min-height:125px;cursor:pointer}.home-card:hover{background:#171c22;border-color:#363d46}.home-card h3{margin:0 0 7px}.home-card p{margin:0;color:#7f8995}.recent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.recent{border:1px solid var(--line);border-radius:10px;padding:12px;background:#11151a;cursor:pointer}.recent:hover{background:#181d23}.recent strong{display:block}.recent small{color:#697480}
.canvas{position:relative;flex:1;overflow:hidden;background:#0b0e12;touch-action:none;cursor:grab}.canvas.dragging{cursor:grabbing}.grid{position:absolute;inset:-20000px;background-image:radial-gradient(#2a3038 1px,transparent 1px);background-size:24px 24px}.canvas-layer{position:absolute;left:0;top:0;transform-origin:0 0}.ink{position:absolute;left:0;top:0;pointer-events:none}.canvas-card{position:absolute;width:240px;min-height:150px;background:#151a20;border:1px solid #343b44;border-radius:12px;box-shadow:0 16px 45px #0008;padding:13px;user-select:none}.canvas-card.selected{border-color:#829dce}.canvas-card .card-head{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}.canvas-card textarea{width:100%;height:92px;resize:none;border:0;outline:0;background:none;color:#dfe4e9;line-height:1.5}.canvas-float{position:absolute;top:14px;left:14px;z-index:5;display:flex;gap:4px;background:#151a20;border:1px solid var(--line);border-radius:10px;padding:5px}.zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;gap:4px;background:#151a20;border:1px solid var(--line);border-radius:9px;padding:4px}
.pdf-layout{display:grid;grid-template-columns:210px minmax(0,1fr);height:calc(100vh - 58px);min-height:0}.pdf-sidebar{border-right:1px solid var(--line);overflow:auto;padding:12px}.pdf-main{overflow:auto;background:#20242a;padding:28px}.pdf-empty{height:100%;display:grid;place-items:center}.thumb{background:#f7f7f7;color:#222;border-radius:4px;margin-bottom:10px;overflow:hidden;cursor:pointer;border:2px solid transparent}.thumb.active{border-color:var(--accent)}.thumb canvas{display:block;width:100%}.thumb small{display:block;padding:4px 7px;background:#171b20;color:#b9c1ca}.page-wrap{position:relative;margin:0 auto 24px;width:max-content;box-shadow:0 15px 50px #0009}.page-wrap canvas.pdf-page{display:block;background:white}.page-ink{position:absolute;left:0;top:0;touch-action:none}.pdf-tools{display:flex;gap:4px;position:sticky;top:0;z-index:10;background:#11151a;border:1px solid var(--line);padding:5px;border-radius:9px;width:max-content;margin:0 auto 16px}.pdf-tools button.active{background:#313944;color:#fff}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center}.modal-box{width:min(760px,92vw);max-height:85vh;overflow:auto;background:#14191f;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between}.version{border:1px solid var(--line);border-radius:9px;padding:10px;margin:7px 0}.toast{position:fixed;right:18px;bottom:18px;background:#eef3fb;color:#0d1117;border-radius:9px;padding:9px 13px;box-shadow:var(--shadow);z-index:100}.drop{border:1px dashed #424a55;border-radius:12px;padding:24px;text-align:center;color:#8e98a3}.attachment{display:flex;justify-content:space-between;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:8px;margin-top:5px;font-size:11px}.scratch-card{position:relative}.expiry{color:#ffd27d;font-size:10px}.empty{padding:28px;color:#66717d;text-align:center}
@media(max-width:1100px){.app{grid-template-columns:210px 280px minmax(0,1fr)}.editor-shell{padding:30px}.editor-grid{grid-template-columns:1fr}.side{display:none}}
@media(max-width:800px){.app{grid-template-columns:64px 1fr}.sidebar{padding:12px 7px}.brand span,.nav span,.section-label,.folders,.bottom span{display:none}.brand{justify-content:center}.library{display:none}.editor-shell{padding:24px}.quick-grid,.recent-grid{grid-template-columns:1fr}.pdf-layout{grid-template-columns:150px 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{
"use strict";
const DB="atlas-notes-db", STORE="workspace", KEY="workspace";
let state={notes:[],scratch:[],canvas:{cards:[],strokes:[]},pdfs:[],versions:{},settings:{},savedAt:0};
let current=null,view="home",query="",filter="all",canvasMode="select",canvasScale=1,canvasPan={x:0,y:0},canvasDragging=false,canvasStart=null,pdfDoc=null,pdfCurrent=1,pdfTool="pen",pdfColor="#f1c75b",pdfSize=3,recording=null,searchTimer=null;

const seed=()=>({notes:[
{id:crypto.randomUUID(),title:"Welcome to Atlas",type:"page",folder:"Personal",tags:["start"],pinned:true,created:Date.now(),updated:Date.now(),body:"<h2>A calm place for serious notes.</h2><p>Atlas is a local-first workspace for lectures, research, PDFs, sketches and quick ideas. This editor supports rich text, checklists, links and images without AI features.</p><blockquote>Notes should help you think, not make you manage the tool.</blockquote>"},
{id:crypto.randomUUID(),title:"Research — materials",type:"research",folder:"Research",tags:["papers","sources"],created:Date.now()-3600000,updated:Date.now()-3600000,body:"<p>Collect source links, quotes, screenshots and your own synthesis here.</p><ul><li>Add a source URL in the Research panel.</li><li>Use [[Note Title]] to create a lightweight backlink.</li></ul>"},
{id:crypto.randomUUID(),title:"Thermodynamics — Lecture 4",type:"page",folder:"University",tags:["mech","uni"],created:Date.now()-7200000,updated:Date.now()-7200000,body:"<h3>Second law</h3><p>Entropy, control volumes and the second law.</p><ul><li>Define the system.</li><li>Identify heat and work interactions.</li><li>Apply the entropy balance.</li></ul>"}
],scratch:[],canvas:{cards:[],strokes:[]},pdfs:[],versions:{},settings:{},savedAt:Date.now()});

function req(p){return new Promise((res,rej)=>{const r=p();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let dbPromise=openDB().catch(()=>null);
async function load(){
 const db=await dbPromise;
 if(!db){try{state=JSON.parse(localStorage.getItem("atlas-fallback")||"null")||seed()}catch{state=seed()}return}
 try{const r=await req(()=>db.transaction(STORE,"readonly").objectStore(STORE).get(KEY));state=r||seed();}catch{state=seed()}
}
async function save(){
 state.savedAt=Date.now();
 const db=await dbPromise;
 if(!db){localStorage.setItem("atlas-fallback",JSON.stringify(state));return}
 try{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(state,KEY)}catch{}
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const strip=s=>String(s??"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
const active=()=>state.notes.find(n=>n.id===current);
function noteText(n){return strip(n?.body||"")}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}
function touch(n=active()){if(!n)return;n.updated=Date.now();save();$("#saveState")&&( $("#saveState").textContent="Saved locally")}
function setView(v){view=v;if(v==="research"&&!active())current=state.notes.find(n=>n.type==="research")?.id||null;render()}
function openNote(id){current=id;view="page";render();setTimeout(()=>$("#editor")?.focus(),30)}
function createNote(type="page",folder="Personal"){
 const n={id:crypto.randomUUID(),title:"Untitled note",type,folder,tags:[],created:Date.now(),updated:Date.now(),body:""};
 state.notes.unshift(n);current=n.id;view="page";save();render();setTimeout(()=>$("#title")?.focus(),30)
}
function createQuick(){const n={id:crypto.randomUUID(),title:"Quick Capture",type:"page",folder:"Personal",tags:["quick"],created:Date.now(),updated:Date.now(),body:""};state.notes.unshift(n);current=n.id;view="page";save();render();setTimeout(()=>$("#editor")?.focus(),30)}
function newScratch(){
 const body=prompt("Scratch note:");if(!body)return;
 const mins=Math.max(1,Number(prompt("Expire after how many minutes?","60"))||60);
 state.scratch.unshift({id:crypto.randomUUID(),title:"Scratch",body,created:Date.now(),expires:Date.now()+mins*60000});save();render()
}
function cleanupScratch(){const before=state.scratch.length;state.scratch=state.scratch.filter(x=>x.expires>Date.now());if(before!==state.scratch.length)save()}
function backlinks(n){return state.notes.filter(x=>x.id!==n.id&&(strip(x.body).toLowerCase().includes(n.title.toLowerCase())||strip(x.body).includes("[["+n.title+"]]")))}
function filteredNotes(){
 let a=state.notes.filter(n=>!query||JSON.stringify(n).toLowerCase().includes(query.toLowerCase()));
 if(filter==="pinned")a=a.filter(n=>n.pinned);
 if(view==="research")a=a.filter(n=>n.type==="research");
 return a.sort((a,b)=>b.updated-a.updated)
}
function layout(){
 document.getElementById("app").innerHTML=`
 <div class="app">
  <aside class="sidebar">
   <div class="brand"><div class="logo">A</div><span>Atlas Notes</span></div>
   <div class="nav">
    <button class="${view==="home"?"active":""}" onclick="go('home')">⌂ <span>Home</span></button>
    <button onclick="quick()">＋ <span>Quick Capture</span></button>
    <button class="${view==="canvas"?"active":""}" onclick="go('canvas')">⌁ <span>Infinite Canvas</span></button>
    <button class="${view==="scratch"?"active":""}" onclick="go('scratch')">◌ <span>Scratch Notes</span></button>
    <button class="${view==="research"?"active":""}" onclick="go('research')">↗ <span>Research</span></button>
    <button class="${view==="pdf"?"active":""}" onclick="go('pdf')">▧ <span>PDF Studio</span></button>
   </div>
   <div class="section-label">Notebooks</div>
   <div class="folders">${["University","Research","Personal","Projects"].map(f=>`<button class="folder" onclick="folder('${f}')"><span>▱ ${f}</span><small class="count">${state.notes.filter(n=>n.folder===f).length}</small></button>`).join("")}</div>
   <div class="bottom"><button class="btn" onclick="exportBackup()">⇩ <span>Export backup</span></button><button class="btn primary" onclick="createNote()">＋ <span>New note</span></button></div>
  </aside>
  <section class="library">
   <div class="library-head">
    <div class="search">⌕ <input id="search" placeholder="Search notes…" value="${esc(query)}"><kbd>Ctrl K</kbd></div>
    <div class="library-tools"><button class="filter ${filter==="all"?"active":""}" onclick="setFilter('all')">All</button><button class="filter ${filter==="pinned"?"active":""}" onclick="setFilter('pinned')">★ Pinned</button><button class="filter" onclick="createNote()">＋</button></div>
   </div>
   <div class="note-list">${renderNoteList()}</div>
  </section>
  <main class="main">${renderMain()}</main>
 </div>`;
 $("#search")?.addEventListener("input",e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=e.target.value;render()},100)});
}
function renderNoteList(){
 if(view==="scratch"){return state.scratch.filter(x=>x.expires>Date.now()).map(x=>`<div class="note-row"><div class="note-row-title">◌ ${esc(x.title)}</div><div class="note-row-preview">${esc(x.body)}</div><div class="note-row-meta"><span>expires ${new Date(x.expires).toLocaleTimeString()}</span></div></div>`).join("")||'<div class="empty">No active scratch notes.</div>'}
 const a=filteredNotes();
 return a.map(n=>`<div class="note-row ${n.id===current?"active":""}" onclick="openNote('${n.id}')"><div class="note-row-title">${n.pinned?'<span class="pin">★</span> ':''}${esc(n.title||"Untitled")}</div><div class="note-row-preview">${esc(noteText(n).slice(0,90)||"Empty note")}</div><div class="note-row-meta"><span>${esc(n.folder||"Personal")}</span><span>·</span><span>${new Date(n.updated).toLocaleDateString()}</span>${(n.tags||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>`).join("")||'<div class="empty">Nothing here yet.</div>'
}
function topbar(label,title,actions=""){return `<div class="topbar"><div><div class="crumb">Atlas / ${esc(label)}</div><div class="top-title">${esc(title)}</div></div><div class="actions">${actions}</div></div>`}
function renderMain(){
 if(view==="home")return renderHome();
 if(view==="canvas")return renderCanvas();
 if(view==="pdf")return renderPdf();
 if(view==="scratch")return renderScratch();
 return renderEditor();
}
function renderHome(){
 const recent=state.notes.slice().sort((a,b)=>b.updated-a.updated).slice(0,8);
 return `<div class="home"><div class="eyebrow">Workspace</div><h1>Good evening.</h1><p class="muted">A focused place for notes, research, diagrams and source material.</p>
 <div class="quick-grid"><div class="home-card" onclick="createNote()"><h3>＋ New page</h3><p>Write a structured note with rich formatting, checklists and links.</p></div><div class="home-card" onclick="quick()"><h3>⚡ Quick Capture</h3><p>Open a note immediately without leaving your current flow.</p></div><div class="home-card" onclick="go('canvas')"><h3>⌁ Infinite Canvas</h3><p>Pan, zoom, sketch and arrange movable note cards.</p></div></div>
 <h3 style="margin-top:36px">Recent</h3><div class="recent-grid">${recent.map(n=>`<div class="recent" onclick="openNote('${n.id}')"><strong>${esc(n.title)}</strong><small>${esc(n.folder)} · ${new Date(n.updated).toLocaleString()}</small><p class="muted">${esc(noteText(n).slice(0,125))}</p></div>`).join("")}</div></div>`
}
function editorToolbar(){
 return `<div class="toolbar">
 <button class="tool" onclick="fmt('bold')" title="Bold"><b>B</b></button><button class="tool" onclick="fmt('italic')" title="Italic"><i>I</i></button><button class="tool" onclick="fmt('underline')" title="Underline"><u>U</u></button>
 <span class="tool-sep"></span><button class="tool" onclick="fmt('formatBlock','h2')">H2</button><button class="tool" onclick="fmt('formatBlock','h3')">H3</button><button class="tool" onclick="fmt('formatBlock','blockquote')">❝</button>
 <span class="tool-sep"></span><button class="tool" onclick="fmt('insertUnorderedList')">• List</button><button class="tool" onclick="fmt('insertOrderedList')">1. List</button><button class="tool" onclick="checklist()">☑</button>
 <span class="tool-sep"></span><button class="tool" onclick="insertLink()">↗ Link</button><button class="tool" onclick="insertImage()">▧ Image</button><button class="tool" onclick="insertCode()">⌘ Code</button>
 <span class="tool-sep"></span><button class="tool" onclick="clearFormat()">Clear</button>
 </div>`
}
function renderEditor(){
 const n=active();if(!n)return `<div class="home"><h1>Select a note</h1><p class="muted">Choose a note or create a new one.</p></div>`;
 const sideBack=backlinks(n).map(x=>`<div class="side-item" onclick="openNote('${x.id}')">↗ ${esc(x.title)}</div>`).join("")||'<div class="muted">No backlinks yet.</div>';
 const atts=(n.attachments||[]).map((a,i)=>`<div class="attachment"><span>▧ ${esc(a.name)}</span><button class="icon" onclick="removeAttachment(${i})">×</button></div>`).join("");
 return topbar(n.folder||"Personal",n.type==="research"?"Research note":"Page",`<span class="status" id="saveState">Saved locally</span><button class="icon" onclick="togglePin()">${n.pinned?"★":"☆"}</button><button class="icon" onclick="showVersions()">◷</button><button class="icon" onclick="recordAudio()">●</button><button class="icon" onclick="exportNote()">⇩</button><button class="icon danger" onclick="deleteNote()">⌫</button>`)+
 `<div class="scroll"><div class="editor-shell"><div class="eyebrow">${n.type==="research"?"Research":"Page"}</div><div class="editor-title" id="title" contenteditable="true" spellcheck="true">${esc(n.title)}</div><div class="editor-meta"><span>${esc(n.folder||"Personal")}</span>${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}<span>·</span><span>${new Date(n.updated).toLocaleString()}</span></div>${editorToolbar()}<div class="editor-grid"><div class="editor" id="editor" contenteditable="true" spellcheck="true">${n.body||""}</div><aside class="side"><div class="side-section"><h4>Backlinks</h4>${sideBack}</div><div class="side-section"><h4>Attachments</h4><button class="btn" onclick="attach()">＋ Add file</button>${atts}</div><div class="side-section"><h4>Audio</h4>${(n.audio||[]).map((a,i)=>`<audio class="audio" controls src="${a.url}"></audio><button class="btn" onclick="removeAudio(${i})">Remove</button>`).join("")||'<div class="muted">No recordings.</div>'}</div><div class="side-section"><h4>Note links</h4><button class="btn" onclick="insertWikiLink()">＋ Link note</button></div></aside></div></div></div>`
}
function bindEditor(){
 const n=active(),title=$("#title"),ed=$("#editor");if(!n||!title||!ed)return;
 title.oninput=()=>{n.title=title.innerText.trim()||"Untitled";touch(n)};
 ed.oninput=()=>{n.body=ed.innerHTML;touch(n)};
 ed.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save();toast("Saved")}};
}
function fmt(cmd,arg=null){document.execCommand(cmd,false,arg);$("#editor")?.focus();const n=active();if(n){n.body=$("#editor").innerHTML;touch(n)}}
function checklist(){document.execCommand("insertHTML",false,'<p>☐ </p>');$("#editor")?.focus();active().body=$("#editor").innerHTML;touch()}
function insertLink(){const u=prompt("URL:");if(u)document.execCommand("createLink",false,u)}
function insertImage(){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.execCommand("insertHTML",false,`<p><img src="${r.result}" alt="${esc(f.name)}"></p>`);active().body=$("#editor").innerHTML;touch()};r.readAsDataURL(f)};input.click()}
function insertCode(){document.execCommand("formatBlock",false,"pre");active().body=$("#editor").innerHTML;touch()}
function clearFormat(){document.execCommand("removeFormat");active().body=$("#editor").innerHTML;touch()}
function insertWikiLink(){
 const n=active();const choices=state.notes.filter(x=>x.id!==n.id);const name=prompt("Note title to link to:\n\n"+choices.slice(0,30).map(x=>x.title).join("\n"));if(!name)return;document.execCommand("insertText",false,"[["+name+"]]");n.body=$("#editor").innerHTML;touch()
}
function folder(f){const n=state.notes.find(x=>x.folder===f);current=n?.id||null;view="page";query="";filter="all";render()}
function setFilter(f){filter=f;render()}
function togglePin(){const n=active();if(!n)return;n.pinned=!n.pinned;touch(n);render()}
function deleteNote(){const n=active();if(!n||!confirm("Delete this note?"))return;state.notes=state.notes.filter(x=>x.id!==n.id);current=state.notes[0]?.id||null;view="home";save();render()}
function attach(){const input=document.createElement("input");input.type="file";input.multiple=true;input.onchange=()=>{const n=active();if(!n)return;n.attachments=n.attachments||[];[...input.files].forEach(f=>{n.attachments.push({id:crypto.randomUUID(),name:f.name,type:f.type,size:f.size})});touch(n);render();toast("Attachment added")};input.click()}
function removeAttachment(i){const n=active();n.attachments.splice(i,1);touch(n);render()}
function recordAudio(){
 const n=active();if(!n)return;
 if(recording){recording.stop();return}
 if(!navigator.mediaDevices?.getUserMedia)return toast("Audio recording is unavailable in this browser.");
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  const rec=new MediaRecorder(stream),chunks=[];recording=rec;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:"audio/webm"});const r=new FileReader();r.onload=()=>{n.audio=n.audio||[];n.audio.push({id:crypto.randomUUID(),name:"Recording "+new Date().toLocaleString(),url:r.result});recording=null;touch(n);render();toast("Recording saved locally")};r.readAsDataURL(blob)};
  rec.start();toast("Recording… click ● again to stop")
 }).catch(()=>toast("Microphone permission was denied."))
}
function removeAudio(i){const n=active();n.audio.splice(i,1);touch(n);render()}
function exportNote(){
 const n=active();if(!n)return;
 const textContent=n.title+"\n\n"+strip(n.body)+"\n";
 download(new Blob([textContent],{type:"text/plain"}),safeName(n.title)+".txt")
}
function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),"atlas-notes-backup.json")}
function safeName(s){return String(s||"note").replace(/[^a-z0-9_-]+/gi,"-").replace(/^-|-$/g,"").slice(0,80)||"note"}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function showVersions(){
 const n=active();if(!n)return;state.versions[n.id]=state.versions[n.id]||[];state.versions[n.id].push({at:Date.now(),title:n.title,body:n.body});save();
 const arr=state.versions[n.id].slice().reverse();
 openModal("Version history",arr.map((v,i)=>`<div class="version"><b>${new Date(v.at).toLocaleString()}</b><p class="muted">${esc(strip(v.body).slice(0,180))}</p><button class="btn" onclick="restoreVersion(${state.versions[n.id].length-1-i})">Restore</button></div>`).join("")||'<p class="muted">No saved versions yet.</p>')
}
function restoreVersion(i){const n=active(),v=state.versions[n.id]?.[i];if(!v)return;n.title=v.title;n.body=v.body;n.updated=Date.now();save();closeModal();render();toast("Version restored")}
function openModal(title,body){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon" onclick="closeModal()">×</button></div>${body}</div></div>`)}
function closeModal(){$("#modal")?.remove()}
function renderScratch(){
 cleanupScratch();
 return topbar("Workspace","Scratch Notes",`<button class="btn primary" onclick="newScratch()">＋ New scratch</button>`)+`<div class="scroll"><div class="home"><div class="eyebrow">Temporary</div><h1>Scratch notes</h1><p class="muted">Fast notes that expire automatically.</p><div class="quick-grid">${state.scratch.filter(x=>x.expires>Date.now()).map(x=>`<div class="home-card scratch-card"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="expiry">Expires ${new Date(x.expires).toLocaleString()}</div></div>`).join("")||'<div class="empty">No active scratch notes.</div>'}</div></div></div>`
}
function renderCanvas(){
 setTimeout(initCanvas,0);
 return topbar("Workspace","Infinite Canvas",`<button class="btn" onclick="canvasAddCard()">＋ Note card</button><button class="btn" onclick="canvasModeSet('pen')">✎ Pen</button><button class="btn" onclick="canvasModeSet('select')">↖ Select</button><button class="btn" onclick="canvasReset()">Reset view</button>`)+
 `<div class="canvas" id="canvas"><div class="grid" id="grid"></div><div class="canvas-layer" id="canvasLayer"></div><canvas class="ink" id="ink"></canvas><div class="canvas-float"><button class="icon" onclick="canvasAddCard()">＋</button><button class="icon" onclick="canvasClearInk()">⌫</button></div><div class="zoom"><button class="icon" onclick="canvasZoom(-.1)">−</button><span style="padding:7px 4px;font-size:11px" id="zoomText">100%</span><button class="icon" onclick="canvasZoom(.1)">＋</button></div></div>`
}
function initCanvas(){
 const c=$("#canvas"),ink=$("#ink"),layer=$("#canvasLayer");if(!c||!ink||!layer)return;
 const resize=()=>{ink.width=c.clientWidth*devicePixelRatio;ink.height=c.clientHeight*devicePixelRatio;ink.style.width=c.clientWidth+"px";ink.style.height=c.clientHeight+"px";redrawInk()};resize();window.onresize=resize;
 renderCanvasLayer();
 c.onwheel=e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();canvasZoom(e.deltaY>0?-.05:.05,e.clientX,e.clientY)}};
 c.onpointerdown=e=>{
  if(canvasMode==="pen"){startStroke(e);return}
  canvasDragging=true;c.classList.add("dragging");canvasStart={x:e.clientX,y:e.clientY,px:canvasPan.x,py:canvasPan.y};c.setPointerCapture(e.pointerId)
 };
 c.onpointermove=e=>{if(canvasMode==="pen"){moveStroke(e);return}if(canvasDragging){canvasPan.x=canvasStart.px+(e.clientX-canvasStart.x);canvasPan.y=canvasStart.py+(e.clientY-canvasStart.y);applyCanvasTransform()}};
 c.onpointerup=()=>{canvasDragging=false;c.classList.remove("dragging")};
}
function applyCanvasTransform(){const layer=$("#canvasLayer"),ink=$("#ink"),grid=$("#grid");if(layer)layer.style.transform=`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasScale})`;if(ink)ink.style.transform=`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasScale})`;if(grid)grid.style.transform=`translate(${canvasPan.x%24}px,${canvasPan.y%24}px)`;$("#zoomText")&&($("#zoomText").textContent=Math.round(canvasScale*100)+"%")}
function renderCanvasLayer(){
 const layer=$("#canvasLayer");if(!layer)return;
 layer.innerHTML=state.canvas.cards.map(c=>`<div class="canvas-card" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px"><div class="card-head"><span>${esc(c.title)}</span><button class="icon" onclick="canvasDelete('${c.id}')">×</button></div><textarea onpointerdown="event.stopPropagation()" oninput="canvasEdit('${c.id}',this.value)">${esc(c.body||"")}</textarea></div>`).join("");
 state.canvas.cards.forEach(c=>{const el=layer.querySelector(`[data-id="${c.id}"]`);if(!el)return;let sx=0,sy=0,ox=c.x,oy=c.y;el.onpointerdown=e=>{if(canvasMode!=="select"||e.target.tagName==="TEXTAREA"||e.target.tagName==="BUTTON")return;e.stopPropagation();sx=e.clientX;sy=e.clientY;ox=c.x;oy=c.y;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!sx)return;c.x=ox+(e.clientX-sx)/canvasScale;c.y=oy+(e.clientY-sy)/canvasScale;el.style.left=c.x+"px";el.style.top=c.y+"px"};el.onpointerup=()=>{sx=0;save()}});applyCanvasTransform()
}
function canvasAddCard(){state.canvas.cards.push({id:crypto.randomUUID(),x:(300-canvasPan.x)/canvasScale,y:(220-canvasPan.y)/canvasScale,title:"Canvas note",body:""});save();renderCanvasLayer()}
function canvasDelete(id){state.canvas.cards=state.canvas.cards.filter(c=>c.id!==id);save();renderCanvasLayer()}
function canvasEdit(id,v){const c=state.canvas.cards.find(x=>x.id===id);if(c){c.body=v;save()}}
function canvasZoom(delta,cx,cy){const old=canvasScale;canvasScale=Math.max(.35,Math.min(2.5,canvasScale+delta));if(cx!=null){const rect=$("#canvas").getBoundingClientRect(),x=cx-rect.left,y=cy-rect.top;canvasPan.x=x-(x-canvasPan.x)*(canvasScale/old);canvasPan.y=y-(y-canvasPan.y)*(canvasScale/old)}applyCanvasTransform()}
function canvasReset(){canvasScale=1;canvasPan={x:0,y:0};applyCanvasTransform()}
function canvasModeSet(m){canvasMode=m;toast(m==="pen"?"Pen mode — draw anywhere":"Select mode — pan and move cards")}
let stroke=null;
function startStroke(e){const rect=$("#canvas").getBoundingClientRect();stroke={points:[[(e.clientX-rect.left-canvasPan.x)/canvasScale,(e.clientY-rect.top-canvasPan.y)/canvasScale]],width:2};state.canvas.strokes.push(stroke);redrawInk()}
function moveStroke(e){if(!stroke)return;const rect=$("#canvas").getBoundingClientRect();stroke.points.push([(e.clientX-rect.left-canvasPan.x)/canvasScale,(e.clientY-rect.top-canvasPan.y)/canvasScale]);redrawInk()}
function redrawInk(){const c=$("#ink");if(!c)return;const g=c.getContext("2d");g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,c.clientWidth,c.clientHeight);g.strokeStyle="#aebfff";g.lineWidth=2;g.lineCap="round";for(const s of state.canvas.strokes){if(!s.points.length)continue;g.beginPath();s.points.forEach((p,i)=>i?g.lineTo(p[0]*canvasScale+canvasPan.x,p[1]*canvasScale+canvasPan.y):g.moveTo(p[0]*canvasScale+canvasPan.x,p[1]*canvasScale+canvasPan.y));g.stroke()}stroke=null;save()}
function canvasClearInk(){state.canvas.strokes=[];save();redrawInk()}
async function loadPdf(file){
 if(!file)return;const bytes=await file.arrayBuffer();const id=crypto.randomUUID();state.pdfs.push({id,name:file.name,bytes:Array.from(new Uint8Array(bytes)),created:Date.now()});save();await openPdfRecord(id)
}
async function openPdfRecord(id){
 const p=state.pdfs.find(x=>x.id===id);if(!p)return;const bytes=new Uint8Array(p.bytes);try{
  if(!window.pdfjsLib)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs","module");
  pdfDoc=await window.pdfjsLib.getDocument({data:bytes}).promise;pdfCurrent=1;renderPdfPages()
 }catch(e){toast("PDF engine could not load. Check your connection and try again.")}
}
function loadScript(src,type){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;if(type)s.type=type;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function renderPdf(){setTimeout(()=>{},0);return topbar("Workspace","PDF Studio",`<label class="btn primary">＋ Import PDF<input id="pdfInput" type="file" accept="application/pdf" hidden></label>`)+`<div class="pdf-layout"><aside class="pdf-sidebar"><div class="muted" style="margin-bottom:10px">Documents</div>${state.pdfs.map(p=>`<button class="btn" style="width:100%;margin-bottom:5px;text-align:left" onclick="openPdfRecord('${p.id}')">▧ ${esc(p.name)}</button>`).join("")||'<div class="empty">Import a PDF to begin.</div>'}</aside><section class="pdf-main" id="pdfMain"><div class="pdf-empty"><div class="drop"><b>PDF Studio</b><p>Import a PDF to render pages locally, add pen/highlighter annotations and keep the document in this workspace.</p><input id="pdfInput2" type="file" accept="application/pdf"></div></div></section></div>`}
async function renderPdfPages(){
 const main=$("#pdfMain");if(!main||!pdfDoc)return;
 main.innerHTML=`<div class="pdf-tools"><button class="${pdfTool==="select"?"active":""}" onclick="pdfSetTool('select')">↖</button><button class="${pdfTool==="pen"?"active":""}" onclick="pdfSetTool('pen')">✎</button><button class="${pdfTool==="highlighter"?"active":""}" onclick="pdfSetTool('highlighter')">▰</button><button class="btn" onclick="pdfUndo()">Undo</button><button class="btn" onclick="pdfClearPage()">Clear page</button></div><div id="pages"></div>`;
 const pages=$("#pages");for(let i=1;i<=pdfDoc.numPages;i++){const page=await pdfDoc.getPage(i);const vp=page.getViewport({scale:1.35});const wrap=document.createElement("div");wrap.className="page-wrap";wrap.dataset.page=i;const c=document.createElement("canvas");c.className="pdf-page";c.width=vp.width;c.height=vp.height;wrap.appendChild(c);const ink=document.createElement("canvas");ink.className="page-ink";ink.width=vp.width;ink.height=vp.height;ink.style.width=vp.width+"px";ink.style.height=vp.height+"px";wrap.appendChild(ink);pages.appendChild(wrap);await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;setupPdfInk(ink,i);drawPdfAnnotations(ink,i)}
}
function pdfAnnotations(){const p=state.pdfs.find(x=>x.id===state.pdfs[state.pdfs.length-1]?.id);return p?.annotations||{}}
function currentPdf(){return state.pdfs[state.pdfs.length-1]}
function setupPdfInk(c,pageNo){let on=false,pts=[];c.onpointerdown=e=>{if(pdfTool==="select")return;on=true;pts=[[e.offsetX,e.offsetY]]};c.onpointermove=e=>{if(!on)return;pts.push([e.offsetX,e.offsetY]);drawStroke(c,pts,pdfTool)};c.onpointerup=()=>{if(!on)return;on=false;const p=currentPdf();p.annotations=p.annotations||{};p.annotations[pageNo]=p.annotations[pageNo]||[];p.annotations[pageNo].push({tool:pdfTool,points:pts.slice(),width:pdfSize,color:pdfColor});save();drawPdfAnnotations(c,pageNo);pts=[]}}
function drawStroke(c,pts,tool){const g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);drawPdfAnnotations(c,Number(c.parentElement.dataset.page));if(!pts.length)return;g.strokeStyle=tool==="highlighter"?"#ffe46a":pdfColor;g.globalAlpha=tool==="highlighter"?.32:1;g.lineWidth=tool==="highlighter"?14:pdfSize;g.lineCap="round";g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.globalAlpha=1}
function drawPdfAnnotations(c,pageNo){const p=currentPdf(),list=p?.annotations?.[pageNo]||[],g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);for(const s of list){g.strokeStyle=s.tool==="highlighter"?"#ffe46a":s.color||pdfColor;g.globalAlpha=s.tool==="highlighter"?.32:1;g.lineWidth=s.tool==="highlighter"?14:s.width||3;g.lineCap="round";g.beginPath();s.points.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}g.globalAlpha=1}
function pdfSetTool(t){pdfTool=t;renderPdfPages()}
function pdfUndo(){const p=currentPdf();if(!p?.annotations)return;const keys=Object.keys(p.annotations);const k=keys[keys.length-1];if(k&&p.annotations[k].length)p.annotations[k].pop();save();renderPdfPages()}
function pdfClearPage(){const p=currentPdf();if(!p?.annotations)return;delete p.annotations[pdfCurrent];save();renderPdfPages()}
function go(v){view=v;query="";filter="all";if(v==="research")current=state.notes.find(n=>n.type==="research")?.id||null;render()}
function quick(){createQuick()}
function searchShortcut(){const s=$("#search");if(s){s.focus();s.select()}}
function render(){layout();if(view==="page")bindEditor();if(view==="pdf"){setTimeout(()=>{const i=$("#pdfInput"),i2=$("#pdfInput2");if(i)i.onchange=()=>loadPdf(i.files[0]);if(i2)i2.onchange=()=>loadPdf(i2.files[0])},0)}}
window.go=go;window.quick=quick;window.createNote=createNote;window.newScratch=newScratch;window.openNote=openNote;window.folder=folder;window.setFilter=setFilter;window.togglePin=togglePin;window.deleteNote=deleteNote;window.fmt=fmt;window.checklist=checklist;window.insertLink=insertLink;window.insertImage=insertImage;window.insertCode=insertCode;window.clearFormat=clearFormat;window.insertWikiLink=insertWikiLink;window.attach=attach;window.removeAttachment=removeAttachment;window.recordAudio=recordAudio;window.removeAudio=removeAudio;window.exportNote=exportNote;window.exportBackup=exportBackup;window.showVersions=showVersions;window.restoreVersion=restoreVersion;window.closeModal=closeModal;window.canvasAddCard=canvasAddCard;window.canvasDelete=canvasDelete;window.canvasEdit=canvasEdit;window.canvasZoom=canvasZoom;window.canvasReset=canvasReset;window.canvasModeSet=canvasModeSet;window.canvasClearInk=canvasClearInk;window.openPdfRecord=openPdfRecord;window.pdfSetTool=pdfSetTool;window.pdfUndo=pdfUndo;window.pdfClearPage=pdfClearPage;window.loadPdf=loadPdf;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();searchShortcut()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();createNote()}});
(async()=>{await load();render()})();
})();
</script>
</body></html>

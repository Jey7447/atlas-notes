name: atlas_notes
description: Atlas Notes — a cloud-first, offline-capable, zero-AI notes, canvas and PDF workspace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  analyzer: 14.4.0

flutter:
  uses-material-design: true

name: Flutter validation

on:
  push:
    branches: [atlas-2.0, main]
    paths-ignore:
      - "build/web/**"
  pull_request:
    branches: [atlas-2.0, main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare Drift web assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-2.0'
        run: |
          mkdir -p web
          curl -fL --retry 3 -o web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.7.0/sqlite3.wasm
          curl -fL --retry 3 -o web/drift_worker.js https://github.com/simolus3/drift/releases/download/drift-2.35.1/drift_worker.js

      - name: Build Flutter web
        if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-2.0'
        run: flutter build web --release

      - name: Publish prebuilt web output
        if: github.event_name == 'push' && github.ref == 'refs/heads/atlas-2.0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/web
          if git diff --cached --quiet; then
            echo "No web build changes to commit."
            exit 0
          fi
          git commit -m "build: publish Flutter web output"
          git push origin HEAD:atlas-2.0
